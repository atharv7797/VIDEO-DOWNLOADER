<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal — link in, file out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10141C;
    --surface:#171C26;
    --surface-raised:#1D2330;
    --line:#2A3140;
    --text:#E9E4D8;
    --text-muted:#8891A3;
    --amber:#C98A3D;
    --amber-dim:#8C6430;
    --green:#6FAE7C;
    --red:#C0574C;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(201,138,61,0.06), transparent 45%),
      var(--ink);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
  }

  .deck{
    width:100%;
    max-width:600px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
  }

  .deck-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 22px;
    border-bottom:1px solid var(--line);
    background:var(--surface-raised);
  }

  .deck-header h1{
    font-size:17px;
    font-weight:600;
    margin:0;
    letter-spacing:0.2px;
  }

  .deck-header .sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--text-muted);
    margin-top:2px;
  }

  .light{
    width:9px; height:9px;
    border-radius:50%;
    background:var(--amber-dim);
    box-shadow:0 0 0 rgba(201,138,61,0);
    transition:background .3s, box-shadow .3s;
  }
  .light.on{ background:var(--amber); box-shadow:0 0 8px var(--amber); }
  .light.ready{ background:var(--green); box-shadow:0 0 8px var(--green); }
  .light.err{ background:var(--red); box-shadow:0 0 8px var(--red); }

  .body{ padding:22px; }

  .input-row{
    display:flex;
    gap:8px;
  }

  input[type=text]{
    flex:1;
    background:var(--ink);
    border:1px solid var(--line);
    border-radius:4px;
    padding:12px 14px;
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    outline:none;
    transition:border-color .2s;
  }
  input[type=text]:focus{ border-color:var(--amber-dim); }
  input[type=text]::placeholder{ color:#4F5768; }

  button{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    border:none;
    border-radius:4px;
    cursor:pointer;
    transition:opacity .15s, transform .1s;
  }
  button:active{ transform:scale(0.98); }
  button:disabled{ opacity:0.45; cursor:default; }

  .btn-fetch{
    background:var(--surface-raised);
    border:1px solid var(--line);
    color:var(--text);
    padding:0 18px;
    font-size:13px;
  }
  .btn-fetch:hover:not(:disabled){ border-color:var(--amber-dim); }

  .status-line{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--text-muted);
    margin-top:10px;
    min-height:14px;
  }
  .status-line.err{ color:var(--red); }

  .result{
    display:none;
    margin-top:22px;
    padding-top:22px;
    border-top:1px solid var(--line);
  }
  .result.show{ display:block; }

  .track{
    display:flex;
    gap:14px;
  }
  .thumb{
    width:120px;
    height:68px;
    object-fit:cover;
    border-radius:4px;
    border:1px solid var(--line);
    flex-shrink:0;
    background:var(--ink);
  }
  .track-meta{ min-width:0; }
  .track-title{
    font-size:14.5px;
    font-weight:600;
    line-height:1.35;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .track-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--text-muted);
    margin-top:6px;
  }

  .quality-row{
    display:flex;
    gap:6px;
    margin-top:18px;
    flex-wrap:wrap;
  }
  .q-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-muted);
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    padding:7px 12px;
    border-radius:4px;
  }
  .q-btn.active{
    border-color:var(--amber);
    color:var(--amber);
    background:rgba(201,138,61,0.08);
  }

  .download-row{
    margin-top:20px;
    display:flex;
    align-items:center;
    gap:14px;
  }

  .btn-download{
    background:var(--amber);
    color:var(--ink);
    padding:12px 22px;
    font-size:13.5px;
    flex-shrink:0;
  }
  .btn-download:hover:not(:disabled){ opacity:0.9; }

  .meter{
    flex:1;
    height:6px;
    background:var(--ink);
    border-radius:3px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .meter-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--amber-dim), var(--amber));
    transition:width .3s ease;
  }

  footer{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:#4F5768;
    margin-top:16px;
  }
</style>
</head>
<body>

  <div>
    <div class="deck">
      <div class="deck-header">
        <div>
          <h1>Signal</h1>
          <div class="sub">paste a link, pull the file</div>
        </div>
        <div class="light" id="statusLight"></div>
      </div>

      <div class="body">
        <div class="input-row">
          <input type="text" id="urlInput" placeholder="https://youtube.com/watch?v=..." autocomplete="off">
          <button class="btn-fetch" id="fetchBtn">Fetch</button>
        </div>
        <div class="status-line" id="statusLine">Idle</div>

        <div class="result" id="result">
          <div class="track">
            <img class="thumb" id="thumb" src="" alt="">
            <div class="track-meta">
              <div class="track-title" id="titleText"></div>
              <div class="track-sub" id="subText"></div>
            </div>
          </div>

          <div class="quality-row" id="qualityRow">
            <button class="q-btn active" data-q="best">Best (≤1080p)</button>
            <button class="q-btn" data-q="1080">1080p</button>
            <button class="q-btn" data-q="720">720p</button>
            <button class="q-btn" data-q="480">480p</button>
            <button class="q-btn" data-q="audio">Audio only</button>
          </div>

          <div class="download-row">
            <button class="btn-download" id="downloadBtn">Download</button>
            <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
          </div>
        </div>
      </div>
    </div>
    <footer>runs locally · nothing leaves this machine except the request to YouTube</footer>
  </div>

<script>
  const urlInput = document.getElementById('urlInput');
  const fetchBtn = document.getElementById('fetchBtn');
  const statusLine = document.getElementById('statusLine');
  const statusLight = document.getElementById('statusLight');
  const result = document.getElementById('result');
  const thumb = document.getElementById('thumb');
  const titleText = document.getElementById('titleText');
  const subText = document.getElementById('subText');
  const qualityRow = document.getElementById('qualityRow');
  const downloadBtn = document.getElementById('downloadBtn');
  const meterFill = document.getElementById('meterFill');

  let selectedQuality = 'best';
  let currentUrl = '';

  function setLight(state){
    statusLight.className = 'light' + (state ? ' ' + state : '');
  }

  function fmtDuration(sec){
    if(!sec) return '';
    const m = Math.floor(sec/60), s = sec%60;
    return `${m}:${s.toString().padStart(2,'0')}`;
  }

  fetchBtn.addEventListener('click', async () => {
    const url = urlInput.value.trim();
    if(!url){ statusLine.textContent = 'Paste a link first.'; statusLine.className='status-line err'; return; }
    currentUrl = url;
    fetchBtn.disabled = true;
    setLight('on');
    statusLine.className = 'status-line';
    statusLine.textContent = 'Reading link...';
    result.classList.remove('show');

    try{
const res = await fetch(`https://video-downloader-72hv.onrender.com/api/info?url=${encodeURIComponent(url)}`);      const data = await res.json();
      if(data.error){ throw new Error(data.error); }

      thumb.src = data.thumbnail || '';
      titleText.textContent = data.title || 'Untitled';
      subText.textContent = [data.uploader, fmtDuration(data.duration)].filter(Boolean).join(' · ');

      result.classList.add('show');
      statusLine.textContent = 'Ready.';
      setLight('ready');
    }catch(e){
      statusLine.className = 'status-line err';
      statusLine.textContent = 'Could not read that link: ' + e.message;
      setLight('err');
    }finally{
      fetchBtn.disabled = false;
    }
  });

  qualityRow.addEventListener('click', (e) => {
    const btn = e.target.closest('.q-btn');
    if(!btn) return;
    document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedQuality = btn.dataset.q;
  });

  downloadBtn.addEventListener('click', async () => {
    downloadBtn.disabled = true;
    meterFill.style.width = '15%';
    statusLine.className = 'status-line';
    statusLine.textContent = 'Downloading and merging on the server... this can take a moment.';

    try{
      const params = new URLSearchParams({ url: currentUrl, quality: selectedQuality });
const res = await fetch(`https://video-downloader-72hv.onrender.com/api/download?${params}`);      if(!res.ok){
        const err = await res.json().catch(()=>({error:'Download failed'}));
        throw new Error(err.error || 'Download failed');
      }
      meterFill.style.width = '70%';
      const blob = await res.blob();

      let filename = 'download';
      const disposition = res.headers.get('Content-Disposition');
      if(disposition){
        const match = disposition.match(/filename="?([^"]+)"?/);
        if(match) filename = match[1];
      }

      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();

      meterFill.style.width = '100%';
      statusLine.textContent = 'Saved: ' + filename;
      setLight('ready');
    }catch(e){
      statusLine.className = 'status-line err';
      statusLine.textContent = e.message;
      setLight('err');
    }finally{
      downloadBtn.disabled = false;
      setTimeout(() => { meterFill.style.width = '0%'; }, 1200);
    }
  });

  urlInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') fetchBtn.click();
  });
</script>
</body>
</html>
