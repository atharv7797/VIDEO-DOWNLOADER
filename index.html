

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YT Downloader</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08090d;--card:rgba(18,20,28,.88);--border:rgba(255,255,255,.09);
  --text:#f5f7fb;--muted:#8f96a6;--accent:#ff3d5a;--accent2:#ff6a3d
}
body{
  min-height:100vh;font-family:Inter,Arial,sans-serif;color:var(--text);
  background:
    radial-gradient(circle at 15% 10%,rgba(255,61,90,.14),transparent 28%),
    radial-gradient(circle at 85% 85%,rgba(255,106,61,.11),transparent 30%),
    var(--bg);
  display:flex;justify-content:center;align-items:center;padding:28px;
}
.app{width:min(900px,100%)}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:14px}
.brand-icon{
  width:48px;height:48px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 10px 35px rgba(255,61,90,.25);font-size:20px
}
h1{font-size:23px;letter-spacing:-.4px}
.brand p{color:var(--muted);margin-top:3px;font-size:13px}
.status-dot{color:#a9b0bd;font-size:13px;display:flex;align-items:center;gap:7px}
.status-dot span{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 12px rgba(74,222,128,.7)}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:22px;
  padding:28px;box-shadow:0 25px 80px rgba(0,0,0,.38);backdrop-filter:blur(18px)
}
.section-title{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}
.section-title span{font-size:18px;font-weight:700}
.section-title small{color:var(--muted);font-size:12px}
label{display:block;font-size:12px;color:#b9bfca;margin-bottom:8px}
.url-row{display:flex;gap:10px}
input,select{
  width:100%;height:48px;border:1px solid var(--border);border-radius:12px;
  outline:none;color:var(--text);background:rgba(255,255,255,.045);
  padding:0 14px;font-size:14px;transition:.2s
}
input:focus,select:focus{border-color:rgba(255,82,99,.65);box-shadow:0 0 0 3px rgba(255,61,90,.08)}
select option{background:#171922}
button{font-family:inherit}
.paste-btn,#folderBtn{
  border:1px solid var(--border);background:rgba(255,255,255,.06);color:#e9ecf2;
  border-radius:12px;padding:0 18px;cursor:pointer;font-weight:600
}
.paste-btn:hover,#folderBtn:hover{background:rgba(255,255,255,.1)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.folder-box{display:flex;gap:8px}
.folder-box input{color:#9da5b3}
.download-btn{
  width:100%;height:52px;margin-top:22px;border:0;border-radius:13px;cursor:pointer;
  color:white;font-size:14px;font-weight:800;
  background:linear-gradient(100deg,var(--accent),var(--accent2));
  box-shadow:0 12px 30px rgba(255,61,90,.22);transition:.18s
}
.download-btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.download-btn:disabled{opacity:.65;cursor:not-allowed;transform:none}
.download-icon{font-size:18px;margin-right:7px}
.progress-area{margin-top:23px}
.progress-info{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:9px}
.progress-info strong{color:#e8ebf1}
.progress-track{height:8px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}
.progress-bar{
  height:100%;width:0;border-radius:inherit;
  background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s ease
}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.info-card{
  display:flex;align-items:center;gap:12px;padding:15px;border:1px solid var(--border);
  border-radius:15px;background:rgba(255,255,255,.025)
}
.info-card>span{font-size:20px}
.info-card strong,.info-card small{display:block}
.info-card strong{font-size:13px}
.info-card small{color:var(--muted);font-size:11px;margin-top:3px}
footer{text-align:center;color:#626978;font-size:11px;margin-top:18px}
footer span{margin:0 3px}
@media(max-width:650px){
  body{padding:16px;align-items:flex-start}
  .header{margin-top:8px}.status-dot{display:none}
  .card{padding:20px;border-radius:18px}
  .section-title{display:block}.section-title small{display:block;margin-top:5px}
  .controls,.info-grid{grid-template-columns:1fr}
  .url-row{flex-direction:column}.paste-btn{height:44px}
}
</style>
</head>

<body>
<main class="app">

<header class="header">
  <div class="brand">
    <div class="brand-icon">▶</div>
    <div>
      <h1>YT Downloader</h1>
      <p>Fast & simple video downloads</p>
    </div>
  </div>
  <div class="status-dot"><span></span> Ready</div>
</header>

<section class="card">
  <div class="section-title">
    <span>Download video</span>
    <small>Paste a YouTube link below</small>
  </div>

  <label for="url">YouTube URL</label>
  <div class="url-row">
    <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
    <button class="paste-btn" id="pasteBtn">Paste</button>
  </div>

  <div class="controls">
    <div class="field">
      <label for="quality">Quality</label>
      <select id="quality">
        <option value="best">Best available (up to 1080p)</option>
        <option value="1080">1080p + audio</option>
        <option value="720">720p + audio</option>
        <option value="480">480p + audio</option>
        <option value="audio">Audio only (MP3)</option>
      </select>
    </div>

    <div class="field">
      <label for="folder">Save to</label>
      <div class="folder-box">
        <input id="folder" type="text" value="Downloads" readonly>
        <button id="folderBtn">Browse</button>
      </div>
    </div>
  </div>

  <button class="download-btn" id="downloadBtn">
    <span class="download-icon">↓</span> Start Download
  </button>

  <div class="progress-area">
    <div class="progress-info">
      <span id="status">Ready to download</span>
      <strong id="percent">0%</strong>
    </div>
    <div class="progress-track">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>
</section>

<section class="info-grid">
  <div class="info-card"><span>⚡</span><div><strong>Fast</strong><small>Efficient downloads</small></div></div>
  <div class="info-card"><span>🎥</span><div><strong>1080p</strong><small>High quality support</small></div></div>
  <div class="info-card"><span>🎵</span><div><strong>MP3</strong><small>Audio-only option</small></div></div>
</section>

<footer>
  <span>YT Downloader</span><span>•</span>
  <span>Use only for content you have permission to download.</span>
</footer>

</main>

<script>
const urlInput=document.getElementById("url");
const quality=document.getElementById("quality");
const folder=document.getElementById("folder");
const downloadBtn=document.getElementById("downloadBtn");
const progressBar=document.getElementById("progressBar");
const percent=document.getElementById("percent");
const status=document.getElementById("status");

document.getElementById("pasteBtn").addEventListener("click",async()=>{
  try{
    urlInput.value=await navigator.clipboard.readText();
    status.textContent="Link pasted";
  }catch{
    urlInput.focus();
    status.textContent="Paste the link into the box";
  }
});

document.getElementById("folderBtn").addEventListener("click",()=>{
  status.textContent="Folder selection will be handled by the Python backend";
});

downloadBtn.addEventListener("click",async()=>{
  const url=urlInput.value.trim();

  if(!url){
    status.textContent="Please paste a YouTube link first";
    urlInput.focus();
    return;
  }

  /*
    FRONTEND DEMO:
    The real download requires your Python backend.
    When your backend API is ready, replace this demo section with:

    fetch("/api/download", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        url:url,
        quality:quality.value
      })
    });
  */

  downloadBtn.disabled=true;
  progressBar.style.width="10%";
  percent.textContent="10%";
  status.textContent="Connecting to downloader...";

  let value=10;

  const timer=setInterval(()=>{
    value+=Math.floor(Math.random()*12)+4;

    if(value>=95){
      value=95;
      clearInterval(timer);
      status.textContent="Waiting for Python backend...";
    }

    progressBar.style.width=value+"%";
    percent.textContent=value+"%";
  },450);

  setTimeout(()=>{
    clearInterval(timer);
    progressBar.style.width="0%";
    percent.textContent="0%";
    status.textContent="Frontend ready — connect your Python backend to start real downloads.";
    downloadBtn.disabled=false;
  },5000);
});
</script>
</body>
</html>
